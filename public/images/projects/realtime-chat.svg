<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgChat" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="50%" stop-color="#0d1f35" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <radialGradient id="ambientSky" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassChat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgChat)" />
  <rect width="1280" height="720" fill="url(#ambientSky)" />
  <rect width="1280" height="720" fill="url(#ambientBlue)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="200" y1="0" x2="200" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1000" y1="0" x2="1000" y2="720" />
  </g>

  <g transform="translate(80, 90)">
    <rect width="220" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1.2">SYSTEM DESIGN · MERN</text>

    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Realtime Chat</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">WebSocket Messaging Platform with JWT Handshake</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="400" fill="#64748b">MERN + Socket.IO: infinite cursor pagination, MongoDB &amp; Docker orchestration</text>

    <g transform="translate(0, 215)">
      <rect width="200" height="90" rx="16" fill="url(#glassChat)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PROTOCOL</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">Socket.IO</text>
    </g>

    <g transform="translate(216, 215)">
      <rect width="210" height="90" rx="16" fill="url(#glassChat)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AUTHENTICATION</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#60a5fa">JWT in Handshake</text>
    </g>

    <g transform="translate(442, 215)">
      <rect width="210" height="90" rx="16" fill="url(#glassChat)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PAGINATION</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#a5b4fc">Cursor Infinite</text>
    </g>
  </g>

  <g transform="translate(740, 100)">
