    <rect x="24" y="24" width="412" height="60" rx="14" fill="#132a45" stroke="#ffffff" stroke-opacity="0.08" />
    <circle cx="56" cy="54" r="16" fill="#0ea5e9" fill-opacity="0.25" />
    <path d="M48 54h16M56 46v16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <text x="86" y="48" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">#general · 42 Connected Clients</text>
    <text x="86" y="68" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">Live WebSocket Stream · Zero Polling</text>

    <g transform="translate(24, 104)">
      <rect width="280" height="64" rx="14" fill="#1a3556" />
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">omkar · 10:24 AM</text>
      <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#ffffff">Docker multi-stage build tested on prod!</text>
    </g>

    <g transform="translate(156, 180)">
      <rect width="280" height="64" rx="14" fill="#0369a1" />
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">dev-team · 10:25 AM</text>
      <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#ffffff">Handshake auth rejected unauthorized sockets 👍</text>
    </g>

    <rect x="24" y="264" width="412" height="196" rx="16" fill="#10253d" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="44" y="298" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">CONTAINER ORCHESTRATION</text>
    <rect x="44" y="314" width="116" height="34" rx="8" fill="#1a3b60" />
    <text x="56" y="336" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">client (nginx)</text>
    <rect x="172" y="314" width="124" height="34" rx="8" fill="#1a3b60" />
    <text x="184" y="336" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">server (node.js)</text>
    <rect x="308" y="314" width="104" height="34" rx="8" fill="#1a3b60" />
    <text x="320" y="336" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">mongo:latest</text>
    <text x="44" y="380" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Bcrypt passwords, cursor pagination &amp; Docker Compose</text>
    <text x="44" y="420" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">React · Node.js · Express · MongoDB · Socket.IO · Docker</text>
