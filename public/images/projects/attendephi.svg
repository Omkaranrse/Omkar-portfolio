<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAtt" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041624" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientBlue" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgAtt)" />
  <rect width="1280" height="720" fill="url(#ambientCyan)" />
  <rect width="1280" height="720" fill="url(#ambientBlue)" />

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="200" y1="0" x2="200" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1000" y1="0" x2="1000" y2="720" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 90)">
    <!-- Badge -->
    <rect width="186" height="34" rx="17" fill="#0891b2" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4.5" fill="#22d3ee" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="1.2">PROJECT 02 · MOBILE</text>

    <!-- Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Attendephi</text>
    
    <!-- Tagline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">Enterprise Mobile Attendance &amp; Workforce Verification</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="400" fill="#64748b">Built with Flutter Clean Architecture, Biometrics &amp; Realtime Geofencing</text>

    <!-- Key Metrics Bento Row -->
    <g transform="translate(0, 215)">
      <!-- Metric 1 -->
      <rect width="210" height="90" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ACTIVE VERIFICATIONS</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#38bdf8">5,000+ / day</text>

      <!-- Metric 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="90" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">LOCATION DRIFT</text>
        <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#4ade80">&lt; 2.4 meters</text>
      </g>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="85" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="42" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Flutter</text>

      <rect x="95" y="0" width="75" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="132" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Dart</text>

      <rect x="180" y="0" width="125" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="242" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Clean Architecture</text>

      <rect x="315" y="0" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="365" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Supabase</text>
    </g>

    <text x="0" y="440" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      Click to open Complete Architecture Breakdown →
    </text>
  </g>

  <!-- Right Mock Phone Screen -->
  <g transform="translate(760, 90)">
    <!-- Device Frame -->
    <rect width="280" height="540" rx="36" fill="#050a12" stroke="#334155" stroke-width="4" />
    <rect x="10" y="10" width="260" height="520" rx="28" fill="#091424" />

    <!-- Dynamic Island -->
    <rect x="95" y="18" width="90" height="18" rx="9" fill="#000000" />

    <!-- App Content Inside Phone -->
    <g transform="translate(25, 60)">
      <!-- Header -->
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">WEDNESDAY, OCT 14</text>
      <text x="0" y="44" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Field Check-In</text>

      <!-- Geofence Status Card -->
      <rect y="64" width="230" height="85" rx="14" fill="#0f2438" stroke="#0284c7" stroke-opacity="0.4" />
      <circle cx="24" cy="90" r="6" fill="#22c55e" />
      <text x="40" y="94" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Inside Zone A-4</text>
      <text x="20" y="125" font-family="-apple-system, sans-serif" font-size="11" fill="#7dd3fc">Accuracy: 99.4% · GPS &amp; BLE</text>

      <!-- QR Scanner Target -->
      <rect y="170" width="230" height="160" rx="16" fill="#071829" stroke="#06b6d4" stroke-dasharray="8 6" stroke-width="1.5" />
      <circle cx="115" cy="245" r="28" fill="#06b6d4" fill-opacity="0.15" />
      <path d="M107 245L113 251L125 239" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <text x="115" y="295" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Facial Liveness Verified</text>

      <!-- Action Button -->
      <rect y="350" width="230" height="46" rx="23" fill="#0284c7" />
      <text x="115" y="378" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Confirm Attendance</text>
    </g>
  </g>
</svg>
