<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBlog" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="50%" stop-color="#1a102a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="ambientPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientFuchsia" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgBlog)" />
  <rect width="1280" height="720" fill="url(#ambientPurple)" />
  <rect width="1280" height="720" fill="url(#ambientFuchsia)" />

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="200" y1="0" x2="200" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1000" y1="0" x2="1000" y2="720" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 90)">
    <!-- Badge -->
    <rect width="200" height="34" rx="17" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4.5" fill="#c084fc" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff" letter-spacing="1.2">PROJECT 03 · AI AGENT</text>

    <!-- Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Blog Research Agent</text>
    
    <!-- Tagline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">Autonomous Multi-Agent Fact Extraction &amp; Synthesis</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="400" fill="#64748b">Orchestrated with LangGraph state machine, web crawlers &amp; markdown formatter</text>

    <!-- Key Metrics Bento Row -->
    <g transform="translate(0, 215)">
      <!-- Metric 1 -->
      <rect width="210" height="90" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">SOURCE VERIFICATION</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#c084fc">98.4% Acc</text>

      <!-- Metric 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="90" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">DRAFT GENERATION</text>
        <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#4ade80">&lt; 18 seconds</text>
      </g>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="95" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="47" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">LangGraph</text>

      <rect x="105" y="0" width="85" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="147" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Tavily</text>

      <rect x="200" y="0" width="105" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="252" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">ChromaDB</text>

      <rect x="315" y="0" width="95" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="362" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">OpenAI</text>
    </g>

    <text x="0" y="440" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#c084fc">
      Click to open Complete Architecture Breakdown →
    </text>
  </g>

  <!-- Right Mock Graph Visualizer -->
  <g transform="translate(680, 110)">
    <rect width="520" height="500" rx="20" fill="#0c0714" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <rect width="520" height="42" rx="20" fill="#180e28" />
    <rect y="22" width="520" height="20" fill="#180e28" />
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="44" cy="21" r="5.5" fill="#eab308" />
    <circle cx="64" cy="21" r="5.5" fill="#22c55e" />
    <text x="260" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#a855f7">agent-state-graph.json</text>

    <!-- Graph Visual Nodes -->
    <g transform="translate(40, 70)">
      <!-- Start Node -->
      <rect x="180" y="10" width="80" height="36" rx="18" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" />
      <text x="220" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff">__start__</text>

      <!-- Down line -->
      <line x1="220" y1="46" x2="220" y2="80" stroke="#a855f7" stroke-width="2" />

      <!-- Planner Node -->
      <rect x="135" y="80" width="170" height="50" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
      <text x="220" y="110" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f5d0fe">PLANNER NODE</text>

      <!-- Branches -->
      <line x1="170" y1="130" x2="90" y2="180" stroke="#a855f7" stroke-width="2" />
      <line x1="270" y1="130" x2="350" y2="180" stroke="#a855f7" stroke-width="2" />

      <!-- Left Worker: Research -->
      <rect x="10" y="180" width="160" height="60" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="90" y="206" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#e0e7ff">RESEARCH NODE</text>
      <text x="90" y="226" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">Tavily Search + Filter</text>

      <!-- Right Worker: Critic -->
      <rect x="270" y="180" width="160" height="60" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
      <text x="350" y="206" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#e0e7ff">CRITIC NODE</text>
      <text x="350" y="226" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">Fact Cross-Check</text>

      <!-- Synthesis Final -->
      <line x1="90" y1="240" x2="220" y2="290" stroke="#a855f7" stroke-width="2" />
      <line x1="350" y1="240" x2="220" y2="290" stroke="#a855f7" stroke-width="2" />

      <rect x="120" y="290" width="200" height="60" rx="14" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="220" y="318" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">SYNTHESIS &amp; DRAFT</text>
      <text x="220" y="336" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">Verified Markdown Ready</text>
    </g>
  </g>
</svg>
