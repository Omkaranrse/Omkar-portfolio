<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e102d" />
    </linearGradient>
    <radialGradient id="ambientOrange" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#ambientOrange)" />
  <rect width="1280" height="720" fill="url(#ambientPurple)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="200" y1="0" x2="200" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1000" y1="0" x2="1000" y2="720" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 90)">
    <!-- Badge -->
    <rect width="170" height="34" rx="17" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4.5" fill="#f97316" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c" letter-spacing="1.2">PROJECT 01 · AI</text>

    <!-- Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">DataMind AI</text>
    
    <!-- Tagline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">Autonomous Conversational Data Query Engine</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="400" fill="#64748b">Powered by LangGraph multi-agent routing, ChromaDB &amp; FastAPI</text>

    <!-- Key Metrics Bento Row -->
    <g transform="translate(0, 215)">
      <!-- Metric 1 -->
      <rect width="210" height="90" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">QUERY LATENCY</text>
      <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#4ade80">&lt; 450ms</text>

      <!-- Metric 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="90" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" />
        <text x="20" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ROUTING ENGINE</text>
        <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">LangGraph</text>
      </g>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="85" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="42" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Python</text>

      <rect x="95" y="0" width="105" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="147" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">ChromaDB</text>

      <rect x="210" y="0" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="255" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">FastAPI</text>

      <rect x="310" y="0" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="360" y="19" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">Next.js 15</text>
    </g>

    <text x="0" y="440" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fb923c">
      Click to open Complete Architecture Breakdown →
    </text>
  </g>

  <!-- Right Mock UI Window -->
  <g transform="translate(680, 110)">
    <!-- Glass Window Container -->
    <rect width="520" height="500" rx="20" fill="#090d16" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="520" height="42" rx="20" fill="#131b2e" />
    <rect y="22" width="520" height="20" fill="#131b2e" />
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="44" cy="21" r="5.5" fill="#eab308" />
    <circle cx="64" cy="21" r="5.5" fill="#22c55e" />
    <text x="260" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">datamind-agent.py [Active Session]</text>

    <!-- Terminal/Query mockup -->
    <g transform="translate(28, 70)">
      <!-- Query bubble -->
      <rect width="464" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="18" y="28" font-family="monospace" font-size="12" fill="#f97316">USER PROMPT &gt;</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="14" fill="#f8fafc">Compare Q3 APAC revenue against projected churn risk</text>

      <!-- Agent Process Nodes -->
      <g transform="translate(0, 88)">
        <rect width="464" height="230" rx="14" fill="#0c1322" stroke="#1e293b" />
        
        <!-- Step 1 -->
        <circle cx="28" cy="35" r="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5" />
        <path d="M25 35L27 37L31 33" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" />
        <text x="48" y="39" font-family="monospace" font-size="12" fill="#e2e8f0">Schema Router: SQL + Vector intent classified (0.98)</text>

        <!-- Step 2 -->
        <circle cx="28" cy="85" r="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5" />
        <path d="M25 85L27 87L31 83" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" />
        <text x="48" y="89" font-family="monospace" font-size="12" fill="#e2e8f0">ChromaDB Retrieval: 8 tabular chunks extracted (32ms)</text>

        <!-- Step 3 -->
        <circle cx="28" cy="135" r="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
        <circle cx="28" cy="135" r="3" fill="#60a5fa" />
        <text x="48" y="139" font-family="monospace" font-size="12" fill="#93c5fd">Synthesis Agent: Generating multi-metric tabular response...</text>

        <!-- Output bar -->
        <rect x="20" y="170" width="424" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="36" y="196" font-family="monospace" font-size="12" fill="#a5b4fc">✔ APAC Revenue: $4.2M (+14.2% YoY) | Churn Risk: Low (2.1%)</text>
      </g>
    </g>
  </g>
</svg>
